name: refresh stats cache

# GitHub 会缓存 README 里的图片（camo，通常数小时到一天）。
# 本工作流每天把 README 中所有 ?v=/&v= 时间戳改成当天日期，
# 强制 Streak / Stats / 奖杯 / 汇总卡 / 蛇 / 3D 图全部重新拉取最新数据。
on:
  schedule:
    - cron: "0 1 * * *" # 每天 01:00，晚于贪吃蛇(00:00)和 3D 图(00:30)的生成
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cache-bust date in README
        run: |
          # 同时覆盖 ?v=（蛇/3D图）和 &amp;v= 里的 ;v=（HTML 实体结尾）两种形态
          sed -i -E "s/([?;])v=[0-9]{8}/\1v=$(date +%Y%m%d)/g" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Date already up to date, nothing to commit."
          else
            git commit -am "chore: refresh stats cache [skip ci]"
            git push
          fi
